trainer: sft
model_type: flaw
config_path: models/flaw/config.json
dataset:
  train_path: /kaggle/working/train.jsonl
  val_path: /kaggle/working/val.jsonl
  test_path: /kaggle/working/test.jsonl
tokenizer_path: /kaggle/working/AURA/models/flaw
output_dir: outputs/checkpoints
seed: 42
batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 3e-4
weight_decay: 0.1
warmup_ratio: 0.05
max_length: 1024
max_steps: 50000
save_steps: 1000
eval_steps: 1000
logging_steps: 25
gradient_checkpointing: false
mixed_precision: bf16